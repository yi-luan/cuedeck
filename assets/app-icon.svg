<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CueDeck">
  <title>CueDeck</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="halo" cx="409.6" cy="76.8" r="307.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20.48" result="b"/>
      <feFlood flood-color="#22d3ee" flood-opacity=".65" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
