  <linearGradient id="ag" x1="163.84" y1="163.84" x2="348.16" y2="348.16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="112.64" fill="url(#bg)" stroke="#94a3b8" stroke-opacity=".28" stroke-width="3.072"/>
  <rect x="20.48" y="20.48" width="471.04" height="471.04" rx="112.64" fill="url(#halo)"/>
  <g transform="rotate(45 256 256)" filter="url(#glow)">
    <rect x="163.84" y="163.84" width="184.32" height="184.32" rx="15.36" fill="url(#ag)"/>
